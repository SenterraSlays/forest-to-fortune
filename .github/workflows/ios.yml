# Builds an unsigned iOS IPA (Actions tab > "iOS IPA" > Run workflow).
# 1. Linux: Unity exports the Xcode project (BuildPipeline.BuildIos).
# 2. Cloud Mac: Xcode compiles it without signing and zips Payload/ into an IPA.
# Sign and install the IPA with Sideloadly or AltStore using your Apple ID.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   UNITY_LICENSE   contents of C:\ProgramData\Unity\Unity_lic.ulf
#   UNITY_EMAIL     Unity account email
#   UNITY_PASSWORD  Unity account password
name: iOS IPA

on:
  workflow_dispatch:

jobs:
  xcode:
    name: Export Xcode project
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space (the Unity image is large)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ github.sha }}
          restore-keys: |
            Library-iOS-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-
            Library-iOS-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          buildMethod: ChoppingTrees.EditorTools.BuildPipeline.BuildIos

      # tar keeps the executable bits of Unity's build-phase scripts (upload-artifact drops them).
      - name: Pack Xcode project
        run: sudo tar -cf xcode.tar -C Builds iOS

      - uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: xcode.tar
          retention-days: 1

  ipa:
    name: Build IPA on macOS
    needs: xcode
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xcode-project

      - name: Compile unsigned IPA
        run: |
          set -eo pipefail
          tar -xf xcode.tar
          cd iOS
          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/game.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            | xcbeautify --quieter
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/game.xcarchive/Products/Applications/"*.app "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/ForestToFortune.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/ForestToFortune.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ForestToFortune-ipa
          path: ForestToFortune.ipa
          retention-days: 14
